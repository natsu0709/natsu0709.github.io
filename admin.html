<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bug Inbox</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07070b;--panel:#0f0f17;--text:#f2f2f7;--sub:#8a8aa3;--line:#22222f;--hot:#d4ff3a;--red:#ff6b8a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 60px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
  h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1}
  h1 span{color:var(--hot)}
  .btn{font:700 .85rem "Zen Kaku Gothic New",sans-serif;border:1px solid var(--line);background:var(--panel);
    color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer}
  .btn.hot{background:var(--hot);color:var(--bg);border-color:var(--hot)}
  .center{text-align:center;padding:80px 0;color:var(--sub);line-height:2}
  .uid{font:500 .8rem "Space Grotesk",monospace;background:var(--panel);border:1px solid var(--line);
    padding:10px;border-radius:8px;word-break:break-all;color:var(--text);margin:12px auto;max-width:420px;user-select:all}
  .stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .stat b{font:700 1.4rem "Space Grotesk",sans-serif;color:var(--hot);display:block}
  .stat small{color:var(--sub);font-size:.75rem}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .filters button{font:700 .8rem "Zen Kaku Gothic New",sans-serif;color:var(--sub);background:var(--panel);
    border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
  .filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .item{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;
    padding:14px 16px;margin-bottom:10px}
  .item.done{border-left-color:var(--line);opacity:.5}
  .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--sub)}
  .game{font-weight:700;color:var(--bg);background:var(--hot);padding:2px 8px;border-radius:3px}
  .text{margin:10px 0;white-space:pre-wrap;word-break:break-word;line-height:1.7}
  .ua{font:500 .7rem "Space Grotesk",monospace;color:#5c5c72;word-break:break-all}
  .acts{display:flex;gap:8px;margin-top:10px}
  .acts .btn{padding:6px 12px;font-size:.78rem}
  .del{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BUG<span>.</span>INBOX</h1>
    <button class="btn" id="logout" hidden>ログアウト</button>
  </header>
  <div id="view"><div class="center">読み込み中…</div></div>
</div>

<script type="module">
import { firebaseConfig, SDK } from "./bug-config.js";
const { initializeApp } = await import(`${SDK}/firebase-app.js`);
const A = await import(`${SDK}/firebase-auth.js`);
const F = await import(`${SDK}/firebase-firestore.js`);

const app = initializeApp(firebaseConfig, "bugadmin");
const auth = A.getAuth(app);
const db = F.getFirestore(app);
const view = document.getElementById("view");
const logoutBtn = document.getElementById("logout");
logoutBtn.onclick = () => A.signOut(auth);

let unsub = null, reports = [], gameFilter = "すべて", showDone = false;

// 送られてくる文章は誰でも書けるので、必ず文字として表示（HTMLとして解釈しない）
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function loginView() {
  view.innerHTML = "";
  const c = el("div", "center");
  c.append(el("div", null, "管理者専用ページです"));
  const b = el("button", "btn hot", "Googleでログイン");
  b.style.marginTop = "16px";
  b.onclick = () => A.signInWithPopup(auth, new A.GoogleAuthProvider()).catch(e => alert(e.message));
  c.append(b);
  view.append(c);
}

function deniedView(user) {
  view.innerHTML = "";
  const c = el("div", "center");
  c.append(el("div", null, "このアカウントには閲覧権限がありません。"));
  c.append(el("div", null, "初回設定なら、下のUIDを firestore.rules に入れてください。"));
  c.append(el("div", "uid", user.uid));
  view.append(c);
}

function render() {
  view.innerHTML = "";
  const games = ["すべて", ...new Set(reports.map(r => r.game))];
  const open = reports.filter(r => !r.done).length;

  const stats = el("div", "stats");
  [[open, "未対応"], [reports.length, "合計"], [games.length - 1, "作品"]].forEach(([n, l]) => {
    const s = el("div", "stat"); s.append(el("b", null, n), el("small", null, l)); stats.append(s);
  });
  view.append(stats);

  const fl = el("div", "filters");
  games.forEach(g => {
    const n = g === "すべて" ? open : reports.filter(r => r.game === g && !r.done).length;
    const b = el("button", g === gameFilter ? "on" : "", `${g}（${n}）`);
    b.onclick = () => { gameFilter = g; render(); };
    fl.append(b);
  });
  const t = el("button", showDone ? "on" : "", showDone ? "対応済みも表示中" : "対応済みを隠し中");
  t.onclick = () => { showDone = !showDone; render(); };
  fl.append(t);
  view.append(fl);

  const list = reports.filter(r => (gameFilter === "すべて" || r.game === gameFilter) && (showDone || !r.done));
  if (!list.length) { view.append(el("div", "center", "バグ報告はありません 🎉")); return; }

  list.forEach(r => {
    const it = el("div", "item" + (r.done ? " done" : ""));
    const meta = el("div", "meta");
    meta.append(el("span", "game", r.game));
    meta.append(el("span", null, r.createdAt ? r.createdAt.toDate().toLocaleString("ja-JP") : "送信中"));
    it.append(meta, el("div", "text", r.text));
    const ua = /iPhone|iPad|Android|Mobile/.test(r.ua) ? "📱 " : "💻 ";
    it.append(el("div", "ua", ua + r.page + "\n" + r.ua));
    const acts = el("div", "acts");
    const d = el("button", "btn", r.done ? "未対応に戻す" : "✓ 対応済み");
    d.onclick = () => F.updateDoc(F.doc(db, "bugReports", r.id), { done: !r.done });
    const x = el("button", "btn del", "削除");
    x.onclick = () => confirm("削除しますか？") && F.deleteDoc(F.doc(db, "bugReports", r.id));
    acts.append(d, x);
    it.append(acts);
    view.append(it);
  });
}

A.onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  logoutBtn.hidden = !user;
  if (!user) return loginView();
  view.innerHTML = '<div class="center">読み込み中…</div>';
  const q = F.query(F.collection(db, "bugReports"), F.orderBy("createdAt", "desc"), F.limit(500));
  unsub = F.onSnapshot(q,
    snap => { reports = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    err => deniedView(user)   // ルールで弾かれた＝あなた以外
  );
});
</script>
</body>
</html>
